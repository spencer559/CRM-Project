<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Same PHI stance as the rest of the app: connect-src 'none' means nothing on this page can
     reach a network. The document arrives by postMessage from the page that opened this tab
     (window-to-window messaging is not a CSP fetch), and pdf.js runs entirely on the vendored
     files beside this page. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF</title>
<style>
/* One job: read a programmer report one page at a time. Every page is scaled to fit the window
   and the scroller snaps per page, so a wheel flick always lands flush on the next page — the
   thing Chrome's own viewer can't do outside Presentation mode. */
:root { --bar: 38px; --bg: #23272e; --bar-bg: #16191d; --text: #dfe5ec; --muted: #8b949e; --border: #3a4048; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 12px/1.4 "Segoe UI", system-ui, sans-serif; overflow: hidden; }
.bar { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); z-index: 10;
       display: flex; align-items: center; gap: 10px; padding: 0 10px;
       background: var(--bar-bg); border-bottom: 1px solid var(--border); }
.bar .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.bar .pager { flex: none; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar .spacer { margin-left: auto; }
.bar button { flex: none; background: #262b33; color: var(--text); border: 1px solid var(--border);
              border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
.bar button:hover { border-color: #58a6ff; }
.zoom-controls { display: inline-flex; align-items: center; gap: 3px; margin-left: 2px; }
.zoom-controls[hidden] { display: none; }
.zoom-controls button { min-width: 29px; padding-left: 7px; padding-right: 7px; }
#zoomFit { min-width: 45px; font-variant-numeric: tabular-nums; }
/* Contents sidebar: the PDF's own outline when it has one, page thumbnails otherwise. Fixed
   beside the scroller; opening it narrows the pages, which re-fit themselves (see refit). */
:root { --toc-w: 232px; }
#toc { position: fixed; left: 0; top: var(--bar); bottom: 0; width: var(--toc-w); z-index: 5;
       overflow-y: auto; background: #1b1f24; border-right: 1px solid var(--border);
       padding: 8px 6px; display: none; }
body.toc-open #toc { display: block; }
body.toc-open #pages, body.toc-open #status { left: var(--toc-w); }
.toc-item { display: block; width: 100%; text-align: left; background: none; border: none;
            color: var(--text); font: inherit; padding: 5px 8px; border-radius: 5px;
            cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.toc-item:hover { background: #262b33; }
.toc-item.active { background: #2b3a55; color: #9ecbff; }
.toc-item .toc-pg { float: right; color: var(--muted); font-size: 10px; padding-left: 6px; }
.toc-thumb { display: flex; flex-direction: column; align-items: center; gap: 3px;
             padding: 7px 4px; white-space: normal; }
.toc-thumb canvas { background: #fff; border: 1px solid var(--border); border-radius: 2px; }
.toc-thumb.active canvas { outline: 2px solid #58a6ff; }
.toc-thumb .toc-pg { float: none; padding: 0; }
#pages { position: fixed; inset: var(--bar) 0 0 0; overflow-y: auto;
         scroll-snap-type: y mandatory; }
.page { display: flex; align-items: center; justify-content: center; overflow: hidden;
        scroll-snap-align: start; scroll-snap-stop: always; }
.page-stage { position: relative; flex: none; }
body.zoomed .page-stage { cursor: grab; touch-action: none; }
body.panning .page-stage { cursor: grabbing; }
.page canvas { position: absolute; inset: 0; background: #fff; box-shadow: 0 3px 18px rgba(0,0,0,.5); }
/* Transparent PDF.js text precisely overlays the canvas. Keeping it per virtualized page makes
   short values (BPM, serial numbers) selectable without retaining a document-wide DOM tree. */
.text-layer { position: absolute; inset: 0; overflow: hidden; opacity: 1; line-height: 1;
              text-align: initial; text-size-adjust: none; forced-color-adjust: none;
              transform-origin: 0 0; z-index: 1; pointer-events: none; }
.text-layer :is(span, br) { position: absolute; color: transparent; white-space: pre;
                            cursor: text; transform-origin: 0 0; pointer-events: auto; }
.text-layer span.markedContent { top: 0; height: 0; }
.text-layer ::selection { background: rgba(43, 126, 247, .38); }
.text-layer br::selection { background: transparent; }
#status { position: fixed; inset: var(--bar) 0 0 0; display: flex; align-items: center;
          justify-content: center; text-align: center; color: var(--muted); font-size: 13px;
          padding: 20px; white-space: pre-line; }
#status[hidden] { display: none; }
/* Embedded in the schedule's split panel: the host owns closing (its file switcher / panel
   collapse), and window.close() can't close an iframe anyway. */
.embedded #closeBtn { display: none; }
/* The shortcuts float over the document, so the toolbar stays one row tall and every pixel
   below it belongs to the PDF. */
#egmSlot { display: contents; }
#egmSlot button[hidden] { display: none; }
.egm-menu { position: fixed; top: var(--bar); right: 8px; width: min(330px, calc(100vw - 16px)); max-height: calc(100vh - var(--bar) - 12px);
  overflow: auto; z-index: 20; padding: 9px; background: #1b1f24; border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 24px #0008; }
.egm-menu[hidden] { display: none; }
.egm-menu button { color: var(--text); background: #262b33; border: 1px solid var(--border); border-radius: 5px; padding: 5px 8px; font: inherit; cursor: pointer; }
.egm-menu select, .egm-menu input:not([type="checkbox"]) { flex: 1 1 0; min-width: 0; background: #262b33; color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 5px 6px; font: inherit; }
.egm-menu button:disabled { opacity: .5; cursor: default; }
.egm-field { display: flex; align-items: center; gap: 6px; margin-top: 6px; min-width: 0; }
.egm-field span { color: var(--muted); flex: 0 0 36px; }
.egm-range-row { display: flex; align-items: end; gap: 6px; flex-wrap: wrap; }
.egm-range-row .egm-field { flex: 1 1 150px; }
.egm-menu [hidden] { display: none !important; }
.egm-dest { align-items: center; }
.egm-dest .egm-drag { padding: 4px 2px; cursor: grab; touch-action: none; border-color: transparent; background: transparent; }
.egm-dragging { opacity: .45; }
.egm-drop-target { outline: 1px solid #58a6ff; border-radius: 5px; }
.egm-check { flex: none; accent-color: #58a6ff; }
.egm-dest .egm-edit, .egm-dest .egm-remove { padding: 4px; flex: 0 0 24px; }
.egm-print-row { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); }
.egm-print-summary { color: var(--muted); }
.egm-error { color: #ffb4a9; margin-top: 6px; }
.egm-save-row { display: flex; gap: 6px; align-items: center; }
.egm-save-row .egm-save { white-space: nowrap; }
.egm-dest { display: flex; gap: 6px; margin-top: 6px; }
.egm-dest .egm-go { flex: 1 1 auto; text-align: left; overflow-wrap: anywhere; }
.egm-dest .egm-remove { flex: 0 0 30px; font-size: 16px; line-height: 1; }
.egm-list:not(:empty) { margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); }
.egm-empty { color: var(--muted); margin: 10px 0 2px; }
.egm-empty[hidden] { display: none; }
.egm-menu button:focus-visible, .egm-menu select:focus-visible, .bar button:focus-visible { outline: 2px solid #58a6ff; outline-offset: 1px; }
@media (max-width: 650px) { .embedded .bar { gap: 5px; } .embedded .bar .name { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <button type="button" id="tocBtn" title="Contents — the PDF's bookmarks, or page thumbnails" aria-expanded="false" hidden>Contents</button>
  <span class="name" id="name">PDF</span>
  <span class="pager" id="pager"></span>
  <span class="zoom-controls" id="zoomControls" aria-label="PDF zoom" hidden>
    <button type="button" id="zoomOut" title="Zoom out (Ctrl/Cmd −)" aria-label="Zoom out">&minus;</button>
    <button type="button" id="zoomFit" title="Fit one complete page (Ctrl/Cmd 0)">Fit</button>
    <button type="button" id="zoomIn" title="Zoom in (Ctrl/Cmd +)" aria-label="Zoom in">+</button>
  </span>
  <span class="spacer"></span>
  <span id="egmSlot"></span>
  <button type="button" id="printBtn" title="Print the complete PDF" hidden>Print</button>
  <button type="button" id="downloadBtn" title="Choose where to save this PDF" hidden>Download</button>
  <button type="button" id="closeBtn" onclick="window.close()" title="Close (Esc)">&#10005;</button>
</div>
<div id="toc" role="navigation" aria-label="Contents"></div>
<div id="pages"></div>
<div id="status">Waiting for the document&hellip;</div>

<script src="../vendor/pdf.min.js"></script>
<script src="../src/pdf-page-selection.js"></script>
<script src="../src/pdf-egm-navigation.js"></script>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var scroller = $("pages"), statusEl = $("status");

  // #id=…&name=… — id pairs this tab with the File the opener is holding for it; name is only
  // cosmetic (title + download name) so it rides the hash rather than another message.
  var params = {};
  (location.hash || "").replace(/^#/, "").split("&").forEach(function (kv) {
    var i = kv.indexOf("=");
    if (i > 0) params[kv.slice(0, i)] = decodeURIComponent(kv.slice(i + 1));
  });
  var docName = params.name || "PDF";
  document.title = docName;
  $("name").textContent = docName;

  // Two hosts can hold the document for us: the page that window.open'd this tab, or — embedded
  // in the schedule's split panel — the parent frame. Same handshake either way.
  var EMBED = params.embed === "1" && window.parent !== window;
  if (EMBED) document.documentElement.classList.add("embedded");
  var host = null;
  try { host = window.opener || null; } catch (e) {}
  if (!host && window.parent !== window) host = window.parent;

  function showStatus(msg) { statusEl.textContent = msg; statusEl.hidden = false; }

  if (typeof pdfjsLib === "undefined") {
    showStatus("The PDF renderer did not load (vendor/pdf.min.js is missing beside this page).");
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = "../vendor/pdf.worker.min.js";

  var doc = null, total = 0, current = 1, tearingDown = false;
  var egmNavigation = null, egmDocumentKey = null;
  function postEgm(type, extra) {
    if (host && params.id) host.postMessage(Object.assign({ type: type, id: params.id, documentKey: egmDocumentKey }, extra || {}), targetOrigin);
  }
  var zoom = 1;
  var ZOOM_STEPS = [1, 1.25, 1.5, 2, 2.5, 3];
  var shells = [];           // one per page: { el, canvas, rendered, task }
  var pageH = 0, pageW = 0;

  /* ---- receiving the document -----------------------------------------------------------
     The opener holds the File under our id and answers our "ready" with the bytes as a
     transferred ArrayBuffer. If this tab was refreshed (opener map gone) or opened directly,
     the timeout below explains how to get back. */
  var receivedDocument = false;
  var viewerInstance = Date.now().toString(36) + Math.random().toString(36).slice(2, 9);
  window.addEventListener("message", function (ev) {
    if (ev.origin !== location.origin) return;
    var m = ev.data || {};
    if (m.type === 'pdfviewer:egm-entries' || m.type === 'pdfviewer:egm-jump') {
      if (ev.source !== host || m.id !== params.id || !egmDocumentKey || m.documentKey !== egmDocumentKey || !egmNavigation) return;
      if (m.type === 'pdfviewer:egm-entries') { egmNavigation.setMarks(m.marks); egmNavigation.setEpisodes(m.entries); }
      else egmNavigation.jump(m.page);
      return;
    }
    if (m.type === "pdfviewer:error" && m.id === params.id && !receivedDocument) {
      receivedDocument = true;
      clearTimeout(waitTimer); clearInterval(readyTimer);
      showStatus(m.message || "The PDF could not be prepared.");
      return;
    }
    if (m.type !== "pdfviewer:doc" || m.id !== params.id || !m.buf || receivedDocument) return;
    receivedDocument = true;
    clearTimeout(waitTimer);
    clearInterval(readyTimer);
    open(m.buf);
  });
  var waitTimer = setTimeout(function () {
    showStatus("No document arrived.\nReopen this file from the Schedule's Files menu or the Report Generator.");
  }, 5000);
  var targetOrigin = location.origin === "null" ? "*" : location.origin;
  try {
    if (host && params.id) host.postMessage({ type: "pdfviewer:ready", id: params.id, instance: viewerInstance }, targetOrigin);
    else showStatus("This viewer shows PDFs opened from the Schedule or the Report Generator.\nOpen one from a patient's Files menu.");
  } catch (e) { /* host gone — the timeout message covers it */ }

  // Repeat until the document arrives. This closes the small timing window created while the
  // schedule promotes an inline report into the full-screen split layout.
  var readyTimer = setInterval(function () {
    try { if (host && params.id) host.postMessage({ type: "pdfviewer:ready", id: params.id, instance: viewerInstance }, targetOrigin); }
    catch (e) {}
  }, 500);
  setTimeout(function () { clearInterval(readyTimer); }, 5000);

  function open(buf) {
    // Hash before pdf.js transfers the buffer, so restored entry links identify the exact PDF.
    var fingerprint = Promise.resolve().then(function () { return crypto.subtle.digest('SHA-256', buf); })
      .then(function (hash) { return 'sha256:' + Array.from(new Uint8Array(hash), function (b) { return b.toString(16).padStart(2, '0'); }).join(''); })
      .catch(function () { return null; });
    // isEvalSupported false: this page's CSP has no 'unsafe-eval', and pdf.js is happy without it.
    fingerprint.then(function (key) {
      egmDocumentKey = key;
      return pdfjsLib.getDocument({ data: buf, isEvalSupported: false }).promise;
    }).then(function (d) {
      doc = d; total = d.numPages;
      statusEl.hidden = true;
      $("printBtn").hidden = $("downloadBtn").hidden = $("tocBtn").hidden = false;
      $("zoomControls").hidden = false;
      egmNavigation = CRMEgmNavigation.mount({ doc: doc, goTo: goTo, toolbar: $("egmSlot"),
        onAssign: function (entryId, page, selection) { postEgm('pdfviewer:egm-assign', Object.assign({ entryId: entryId, page: page }, selection)); },
        onRemove: function (page, savedId) { postEgm('pdfviewer:egm-remove', { page: page, savedId: savedId }); },
        onReorder: function (ids) { postEgm('pdfviewer:egm-reorder', { ids: ids }); },
        onPrint: function (pages) { return printSelectedPages(pages); },
        position: function () { var s = shells[current - 1]; return { page: current, zoom: zoom, x: s ? s.panX : 0, y: s ? s.panY : 0 }; },
        restore: function (pos) {
          setZoom(pos.zoom);
          var s = shells[pos.page - 1];
          if (s) { s.panX = pos.x; s.panY = pos.y; if (s.rendered) applyPan(s); }
          goTo(pos.page);
        }
      });
      buildShells();
      layout();
      updatePager();
      buildToc();
      postEgm('pdfviewer:egm-ready', { numPages: total });
    }).catch(function (e) {
      showStatus("Could not open " + docName + ": " + e.message);
    });
  }

  /* ---- layout & virtualised rendering ---------------------------------------------------
     Every page wrapper is exactly one scroller-viewport tall — that is what makes mandatory
     snap read as "one flick, one page". Canvases only exist near the viewport: a programmer
     report can run past a hundred pages, and keeping every rendered canvas alive would cost
     several megabytes each. The observer renders what approaches and releases what leaves. */
  var io = null;
  function buildShells() {
    scroller.innerHTML = ""; shells = [];
    if (io) io.disconnect();
    io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var i = +en.target.dataset.i;
        if (en.isIntersecting) render(i); else release(i);
      });
    // Embedded split view values memory more than an extra page of look-ahead. A smaller margin
    // keeps the current page and its neighbors ready without holding five full-resolution canvases.
    }, { root: scroller, rootMargin: (EMBED ? "60% 0px" : "100% 0px") });
    for (var i = 1; i <= total; i++) {
      var el = document.createElement("div");
      el.className = "page"; el.dataset.i = i;
      var stage = document.createElement("div");
      stage.className = "page-stage";
      var canvas = document.createElement("canvas");
      canvas.width = 0; canvas.height = 0;   // a default canvas is 300x150 — 120 pages of that is real memory
      var textLayer = document.createElement("div");
      textLayer.className = "text-layer";
      stage.appendChild(canvas); stage.appendChild(textLayer); el.appendChild(stage);
      scroller.appendChild(el);
      shells.push({ el: el, stage: stage, canvas: canvas, textLayer: textLayer,
        rendered: false, task: null, panX: 0, panY: 0 });
      io.observe(el);
    }
  }
  function layout() {
    pageH = scroller.clientHeight; pageW = scroller.clientWidth;
    shells.forEach(function (s) { s.el.style.height = pageH + "px"; });
  }
  function render(i) {
    var s = shells[i - 1];
    if (!s || s.rendered || s.task || !doc || tearingDown) return;
    var work = { canvas: null, text: null };
    s.task = work;                                   // unique ownership across every async stage
    doc.getPage(i).then(function (page) {
      if (s.task !== work) { try { page.cleanup(); } catch (e) {} return; }
      var v1 = page.getViewport({ scale: 1 });
      // Fit the whole page inside the viewport with a small breathing margin.
      var scale = Math.min((pageW - 20) / v1.width, (pageH - 16) / v1.height) * zoom;
      var vp = page.getViewport({ scale: scale });
      // A 2x portrait page can exceed 10 MB before the browser's GPU copy. In the split pane 1.5x
      // remains crisp at normal reading size and cuts pixel memory by roughly forty-four percent.
      // Zoom increases the vector render detail, but cap total backing resolution so a 3x view
      // cannot consume nine times the fit-mode canvas memory. Fit keeps its existing 2x/1.5x cap;
      // zoomed pages top out at 3x/2.25x total backing scale.
      var dprCap = (EMBED ? 2.25 : 3) / zoom;
      var dpr = Math.max(0.75, Math.min(window.devicePixelRatio || 1, dprCap, EMBED ? 1.5 : 2));
      // Do not expose pdf.js's progressive canvas tiles. During a fast direction reversal a page
      // can enter, leave, and re-enter while its prior paint is being cancelled; revealing only a
      // completed paint prevents a transient quadrant from flashing on screen.
      s.canvas.style.visibility = "hidden";
      s.canvas.width = Math.floor(vp.width * dpr);
      s.canvas.height = Math.floor(vp.height * dpr);
      s.canvas.style.width = Math.floor(vp.width) + "px";
      s.canvas.style.height = Math.floor(vp.height) + "px";
      s.stage.style.width = s.textLayer.style.width = Math.floor(vp.width) + "px";
      s.stage.style.height = s.textLayer.style.height = Math.floor(vp.height) + "px";
      applyPan(s);
      s.textLayer.style.setProperty("--scale-factor", vp.scale);
      work.canvas = page.render({ canvasContext: s.canvas.getContext("2d"), viewport: vp, transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null });
      var canvasDone = work.canvas.promise.then(function () {
        if (s.task === work) s.canvas.style.visibility = "visible";
      });

      // Text extraction/rendering is deliberately non-fatal: a scanned report still displays its
      // canvas normally. The task belongs to the same virtual page and is cancelled/removed with it.
      var textDone = page.getTextContent({ includeMarkedContent: true }).then(function (content) {
        if (s.task !== work) return;
        work.text = pdfjsLib.renderTextLayer({
          textContentSource: content,
          container: s.textLayer,
          viewport: vp,
          textDivs: []
        });
        return work.text.promise;
      }).catch(function () {});
      return Promise.all([canvasDone, textDone]).then(function () {
        if (s.task === work) { s.rendered = true; s.task = null; }
        page.cleanup();                              // parsed page content; the canvas keeps the pixels
      });
    }).catch(function () {
      if (s.task === work) s.task = null;
    });                                              // cancelled by a release/resize — it'll re-enter
  }
  function release(i) {
    var s = shells[i - 1];
    if (!s) return;
    var painting = !!(s.task && s.task.canvas);
    // Hide before clearing the backing store. A zero-pixel canvas with its old CSS width/height
    // can otherwise be composited for one frame as a rectangular GPU artifact.
    s.canvas.style.visibility = "hidden";
    if (painting && s.task.canvas.cancel) { try { s.task.canvas.cancel(); } catch (e) {} }
    if (s.task && s.task.text && s.task.text.cancel) { try { s.task.text.cancel(); } catch (e) {} }
    s.task = null;
    if (painting) {
      // A cancelled PDF.js render may settle asynchronously. Detach its canvas so a rapid
      // re-entry always paints into a fresh backing store instead of racing the old task.
      var oldCanvas = s.canvas, freshCanvas = document.createElement("canvas");
      freshCanvas.width = 0; freshCanvas.height = 0; freshCanvas.style.visibility = "hidden";
      oldCanvas.replaceWith(freshCanvas); s.canvas = freshCanvas;
    } else if (s.canvas.width || s.canvas.height) {
      s.canvas.width = 0; s.canvas.height = 0;
    }
    s.canvas.style.width = s.canvas.style.height = "0px";
    s.textLayer.replaceChildren();
    s.stage.style.width = s.stage.style.height = "0px";
    s.rendered = false;
  }

  /* ---- zoom and pan ---------------------------------------------------------------------
     Zoom never changes the outer page shell: it remains exactly one viewport high and therefore
     keeps the same mandatory one-page snap. Only the stage inside that shell grows. Drag blank
     PDF space to pan; text spans retain normal selection behavior for copying small values. */
  function applyPan(s) {
    if (!s || !s.stage) return;
    var sw = parseFloat(s.stage.style.width) || 0, sh = parseFloat(s.stage.style.height) || 0;
    var bx = Math.max(0, (sw - pageW) / 2), by = Math.max(0, (sh - pageH) / 2);
    s.panX = Math.max(-bx, Math.min(bx, s.panX || 0));
    s.panY = Math.max(-by, Math.min(by, s.panY || 0));
    s.stage.style.transform = "translate(" + s.panX + "px," + s.panY + "px)";
  }
  function updateZoomUi() {
    document.body.classList.toggle("zoomed", zoom > 1);
    $("zoomFit").textContent = zoom === 1 ? "Fit" : Math.round(zoom * 100) + "%";
    $("zoomOut").disabled = zoom === ZOOM_STEPS[0];
    $("zoomIn").disabled = zoom === ZOOM_STEPS[ZOOM_STEPS.length - 1];
  }
  function setZoom(next) {
    next = Math.max(ZOOM_STEPS[0], Math.min(ZOOM_STEPS[ZOOM_STEPS.length - 1], next));
    if (next === zoom) return;
    zoom = next;
    shells.forEach(function (s) { s.panX = s.panY = 0; });
    updateZoomUi();
    refit();
  }
  function stepZoom(direction) {
    var at = ZOOM_STEPS.indexOf(zoom);
    if (at < 0) at = 0;
    setZoom(ZOOM_STEPS[Math.max(0, Math.min(ZOOM_STEPS.length - 1, at + direction))]);
  }
  $("zoomOut").addEventListener("click", function () { stepZoom(-1); });
  $("zoomIn").addEventListener("click", function () { stepZoom(1); });
  $("zoomFit").addEventListener("click", function () { setZoom(1); });

  var panDrag = null;
  scroller.addEventListener("pointerdown", function (ev) {
    if (zoom <= 1 || ev.button !== 0 || (ev.target.closest && ev.target.closest(".text-layer span"))) return;
    var stage = ev.target.closest && ev.target.closest(".page-stage");
    if (!stage) return;
    var page = stage.parentNode, s = shells[(+page.dataset.i || 1) - 1];
    if (!s) return;
    ev.preventDefault();
    panDrag = { pointer: ev.pointerId, shell: s, x: ev.clientX, y: ev.clientY, px: s.panX, py: s.panY };
    document.body.classList.add("panning");
    try { stage.setPointerCapture(ev.pointerId); } catch (e) {}
  });
  scroller.addEventListener("pointermove", function (ev) {
    if (!panDrag || ev.pointerId !== panDrag.pointer) return;
    panDrag.shell.panX = panDrag.px + ev.clientX - panDrag.x;
    panDrag.shell.panY = panDrag.py + ev.clientY - panDrag.y;
    applyPan(panDrag.shell);
  });
  function endPan(ev) {
    if (!panDrag || (ev && ev.pointerId !== panDrag.pointer)) return;
    panDrag = null; document.body.classList.remove("panning");
  }
  scroller.addEventListener("pointerup", endPan);
  scroller.addEventListener("pointercancel", endPan);

  // The fit is a function of the scroller's size, so anything that changes it — a window resize,
  // the Contents sidebar opening — re-lays-out and re-renders, keeping the page you were on.
  function refit() {
    var page = current;
    shells.forEach(function (s, n) { release(n + 1); });
    layout();
    goTo(page);
    // Opening Contents changes the available width without moving the current page out of the
    // observer's intersection area. Because its canvas was just released, no new observer event
    // is guaranteed to redraw it. Explicitly warm the current page and its nearby snap targets
    // after cancelled render tasks have settled.
    requestAnimationFrame(function () {
      var center = current, radius = EMBED ? 1 : 2;
      for (var i = Math.max(1, center - radius); i <= Math.min(total, center + radius); i++) render(i);
    });
  }
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(refit, 150);
  });

  /* ---- contents sidebar ------------------------------------------------------------------
     The PDF's own outline when it carries one (programmer exports often bookmark their
     sections), page thumbnails otherwise — a heading TOC can't be conjured from a PDF that
     doesn't declare one, and thumbnails are what you actually scan for an EGM strip anyway. */
  var tocEl = $("toc"), tocBtn = $("tocBtn");
  var tocEntries = [];        // outline mode: [{ page, el }] sorted by page, for the highlight
  var tocThumbs = [];         // thumbnail mode: one per page
  var tocMode = null, lastHighlighted = 0;

  function toggleToc(open) {
    var want = (open !== undefined) ? open : !document.body.classList.contains("toc-open");
    document.body.classList.toggle("toc-open", want);
    tocBtn.setAttribute("aria-expanded", want ? "true" : "false");
    refit();                  // the scroller just changed width — pages need a new fit
    if (want) highlightToc(true);
  }
  tocBtn.addEventListener("click", function () { toggleToc(); });

  // An outline destination names a page indirectly; resolve to a 1-based number, null on any
  // of the malformed shapes real-world PDFs produce.
  function outlinePage(dest) {
    return Promise.resolve(typeof dest === "string" ? doc.getDestination(dest) : dest)
      .then(function (d) { return (d && d[0]) ? doc.getPageIndex(d[0]) : null; })
      .then(function (i) { return (i == null) ? null : i + 1; })
      .catch(function () { return null; });
  }
  function buildToc() {
    doc.getOutline().then(function (outline) {
      var flat = [];
      (function walk(items, depth) {
        (items || []).forEach(function (it) {
          flat.push({ title: it.title, dest: it.dest, depth: depth });
          walk(it.items, depth + 1);
        });
      })(outline, 0);
      if (!flat.length) { buildThumbToc(); return; }
      Promise.all(flat.map(function (f) { return outlinePage(f.dest); })).then(function (pages) {
        tocMode = "outline"; tocEl.innerHTML = "";
        tocEntries = [];
        flat.forEach(function (f, n) {
          if (pages[n] == null) return;
          var b = document.createElement("button");
          b.type = "button"; b.className = "toc-item";
          b.style.paddingLeft = (8 + f.depth * 14) + "px";
          b.title = f.title;
          b.innerHTML = '<span class="toc-pg">' + pages[n] + "</span>";
          b.insertBefore(document.createTextNode(f.title), b.firstChild);
          b.addEventListener("click", function () { goTo(pages[n]); });
          tocEl.appendChild(b);
          tocEntries.push({ page: pages[n], el: b });
        });
        tocEntries.sort(function (a, b) { return a.page - b.page; });
        // A real outline is worth screen space; thumbnails are opt-in via the button.
        if (window.innerWidth > 900) toggleToc(true);
      });
    }).catch(function () { buildThumbToc(); });
  }
  var thumbIo = null;
  function buildThumbToc() {
    tocMode = "thumbs"; tocEl.innerHTML = "";
    tocThumbs = [];
    if (thumbIo) thumbIo.disconnect();
    // Render on approach and release after leaving the buffered sidebar viewport. Long programmer
    // reports otherwise accumulate one permanent canvas per page merely from browsing Contents.
    thumbIo = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        var i = +en.target.dataset.i;
        if (en.isIntersecting) renderThumb(i); else releaseThumb(i);
      });
    }, { root: tocEl, rootMargin: "120% 0px" });
    for (var i = 1; i <= total; i++) {
      var b = document.createElement("button");
      b.type = "button"; b.className = "toc-item toc-thumb"; b.dataset.i = i;
      var c = document.createElement("canvas");
      c.width = 0; c.height = 0;
      b.appendChild(c);
      var lbl = document.createElement("span");
      lbl.className = "toc-pg"; lbl.textContent = i;
      b.appendChild(lbl);
      (function (p) { b.addEventListener("click", function () { goTo(p); }); })(i);
      tocEl.appendChild(b);
      tocThumbs.push({ el: b, canvas: c, done: false, task: null });
      thumbIo.observe(b);
    }
  }
  function renderThumb(i) {
    var t = tocThumbs[i - 1];
    if (!t || t.done || t.task || !doc) return;
    var claim = {}, renderTask = null;
    t.task = claim;                                  // unique ownership while getPage is pending
    doc.getPage(i).then(function (page) {
      if (t.task !== claim) { try { page.cleanup(); } catch (e) {} return; }
      var v1 = page.getViewport({ scale: 1 });
      var vp = page.getViewport({ scale: 150 / v1.width });
      t.canvas.width = Math.floor(vp.width); t.canvas.height = Math.floor(vp.height);
      t.canvas.style.width = Math.floor(vp.width) + "px";
      renderTask = page.render({ canvasContext: t.canvas.getContext("2d"), viewport: vp });
      t.task = renderTask;
      return renderTask.promise.then(function () {
        if (t.task === renderTask) { t.done = true; t.task = null; }
        page.cleanup();
      });
    }).catch(function () {
      if (t.task === claim || t.task === renderTask) { t.task = null; t.done = false; }
    });
  }
  function releaseThumb(i) {
    var t = tocThumbs[i - 1];
    if (!t) return;
    if (t.task && t.task.cancel) { try { t.task.cancel(); } catch (e) {} }
    t.task = null; t.done = false;
    t.canvas.width = 0; t.canvas.height = 0;
  }
  // Track the reading position: the outline entry you are inside, or the thumbnail of the
  // current page. `force` re-asserts after a toggle even though the page didn't change.
  function highlightToc(force) {
    if (!tocMode || (!force && current === lastHighlighted)) return;
    lastHighlighted = current;
    if (tocMode === "outline") {
      var active = null;
      tocEntries.forEach(function (e) {
        if (e.page <= current) active = e;
        e.el.classList.remove("active");
      });
      if (active) { active.el.classList.add("active"); active.el.scrollIntoView({ block: "nearest" }); }
    } else {
      tocThumbs.forEach(function (t, n) { t.el.classList.toggle("active", n + 1 === current); });
      var cur = tocThumbs[current - 1];
      if (cur) cur.el.scrollIntoView({ block: "nearest" });
    }
  }

  /* ---- paging ---- */
  function updatePager() {
    current = Math.min(total, Math.max(1, Math.round(scroller.scrollTop / (pageH || 1)) + 1));
    $("pager").textContent = total ? current + " / " + total : "";
    highlightToc();
    if (egmNavigation) egmNavigation.updatePosition();
  }
  scroller.addEventListener("scroll", updatePager);
  var snapRestoreFrame = null;
  function goTo(p) {
    p = Math.min(total, Math.max(1, p));
    // Disable snap only for this exact placement. Otherwise Chrome can animate a short "settle"
    // even though the destination is already a page boundary.
    if (snapRestoreFrame) cancelAnimationFrame(snapRestoreFrame);
    scroller.style.scrollSnapType = "none";
    render(p);                                      // ensure the destination canvas is already claimed
    scroller.scrollTo({ top: (p - 1) * pageH, left: 0, behavior: "instant" });
    updatePager();
    snapRestoreFrame = requestAnimationFrame(function () {
      scroller.style.scrollSnapType = "y mandatory";
      snapRestoreFrame = null;
    });
  }
  // Cancel native scrolling and treat every ordinary wheel event as an Arrow key. Ctrl/Cmd-wheel
  // is reserved for the viewer's bounded zoom rather than allowing browser chrome zoom to resize
  // the whole UI. Zoom gets a short lock because trackpads emit a stream of tiny pinch events;
  // ordinary page-wheel navigation deliberately remains unthrottled.
  var zoomWheelLocked = false;
  scroller.addEventListener("wheel", function (ev) {
    if (!doc) return;
    if (ev.ctrlKey || ev.metaKey) {
      ev.preventDefault();
      if (zoomWheelLocked || Math.abs(ev.deltaY) < 0.5) return;
      zoomWheelLocked = true;
      stepZoom(ev.deltaY < 0 ? 1 : -1);
      setTimeout(function () { zoomWheelLocked = false; }, 120);
      return;
    }
    if (Math.abs(ev.deltaY) < Math.abs(ev.deltaX)) return;
    ev.preventDefault();
    var amount = Math.abs(ev.deltaY), legacy = Math.abs(ev.wheelDelta || 0);
    if (amount < 0.5) return;
    // Some drivers combine several notches into one event. Preserve that count when Chrome exposes
    // the traditional 120-units-per-notch value; otherwise the event is one page.
    var steps = legacy >= 120 && legacy % 120 === 0 ? Math.round(legacy / 120) : 1;
    goTo(current + (ev.deltaY > 0 ? 1 : -1) * Math.min(steps, 10));
  }, { passive: false });
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { if (!EMBED) window.close(); return; }   // embedded: the host owns closing
    if (!doc) return;
    if (ev.ctrlKey || ev.metaKey) {
      if (ev.key === "0") { ev.preventDefault(); setZoom(1); return; }
      if (ev.key === "+" || ev.key === "=") { ev.preventDefault(); stepZoom(1); return; }
      if (ev.key === "-" || ev.key === "_") { ev.preventDefault(); stepZoom(-1); return; }
    }
    var next = { "PageDown": 1, "ArrowDown": 1, "ArrowRight": 1, " ": 1, "PageUp": -1, "ArrowUp": -1, "ArrowLeft": -1 }[ev.key];
    if (ev.key === " " && ev.shiftKey) next = -1;
    if (ev.key === "Home") { ev.preventDefault(); goTo(1); return; }
    if (ev.key === "End") { ev.preventDefault(); goTo(total); return; }
    if (!next) return;
    ev.preventDefault();
    goTo(current + next);
  });

  // Removing a split-view iframe should release its pdf.js worker, parsed document, render tasks,
  // and GPU-backed canvases immediately instead of waiting for Chrome's next garbage collection.
  function teardownViewer() {
    if (tearingDown) return;
    tearingDown = true;
    clearTimeout(waitTimer); clearTimeout(resizeTimer); clearInterval(readyTimer);
    if (snapRestoreFrame) cancelAnimationFrame(snapRestoreFrame);
    if (io) io.disconnect();
    if (thumbIo) thumbIo.disconnect();
    shells.forEach(function (_s, n) { release(n + 1); });
    tocThumbs.forEach(function (_t, n) { releaseThumb(n + 1); });
    var oldDoc = doc; doc = null;
    if (oldDoc && oldDoc.destroy) { try { oldDoc.destroy(); } catch (e) {} }
  }
  window.addEventListener("pagehide", function (ev) { if (!ev.persisted) teardownViewer(); });

  /* ---- escape hatches ---- */
  // pdf.js keeps the original bytes; getData() hands them back so Print and Download never need
  // a second copy of the document held around just in case.
  var printFrame = null, printUrl = null, printCleanupTimer = null;
  var selectionJob = null, printGeneration = 0;
  function cleanupPrintFrame() {
    printGeneration++;
    if (selectionJob) selectionJob.cancel();
    clearTimeout(printCleanupTimer);
    if (printFrame && printFrame.parentNode) printFrame.parentNode.removeChild(printFrame);
    if (printUrl) URL.revokeObjectURL(printUrl);
    printFrame = null; printUrl = null;
  }
  function showPrintBytes(bytes, generation) {
    if (generation !== printGeneration) return;
    printUrl = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    printFrame = document.createElement('iframe');
    printFrame.title = 'Print ' + docName;
    printFrame.style.cssText = 'position:fixed;width:1px;height:1px;right:0;bottom:0;border:0;opacity:0;pointer-events:none';
    printFrame.onload = function () {
      setTimeout(function () {
        if (generation !== printGeneration) return;
        try {
          var pw = printFrame && printFrame.contentWindow;
          if (!pw) throw new Error('Print frame unavailable');
          pw.focus(); pw.onafterprint = cleanupPrintFrame; pw.print();
        } catch (e) {
          cleanupPrintFrame();
          window.alert('Could not open the print dialog. Try Print again.');
        }
      }, 250);
    };
    printFrame.src = printUrl;
    document.body.appendChild(printFrame);
    printCleanupTimer = setTimeout(cleanupPrintFrame, 120000);
  }
  function printSelectedPages(pages) {
    if (!doc) return Promise.resolve();
    cleanupPrintFrame();
    var generation = printGeneration;
    return doc.getData().then(function (bytes) {
      if (generation !== printGeneration) return;
      return new Promise(function (resolve, reject) {
        var worker = new Worker('../src/pdf-selection-worker.js');
        var job = { cancel: function () { finish(new Error('Print cancelled.')); } };
        var timer = setTimeout(function () { finish(new Error('Print preparation timed out. Try fewer pages.')); }, 120000);
        selectionJob = job;
        function finish(error, selected) {
          clearTimeout(timer); worker.terminate();
          if (selectionJob === job) selectionJob = null;
          if (error) reject(error);
          else { showPrintBytes(selected, generation); resolve(); }
        }
        worker.onmessage = function (ev) { finish(ev.data.error ? new Error(ev.data.error) : null, ev.data.bytes); };
        worker.onerror = function () { finish(new Error('Could not prepare selected pages.')); };
        // getData returns a fresh copy; transferring it avoids another main-thread copy.
        try { worker.postMessage({ bytes: bytes, pages: pages }, [bytes.buffer]); }
        catch (e) { finish(e); }
      });
    });
  }
  $('printBtn').addEventListener('click', function () {
    if (!doc) return;
    cleanupPrintFrame();
    var generation = printGeneration;
    doc.getData().then(function (bytes) { showPrintBytes(bytes, generation); }).catch(function (e) {
      window.alert('Could not prepare this PDF for printing: ' + e.message);
    });
  });
  function classicDownload(blob, name) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  $("downloadBtn").addEventListener("click", function () {
    if (!doc) return;
    var name = /\.pdf$/i.test(docName) ? docName : docName + ".pdf";

    // The picker must be opened immediately from this click, before the asynchronous pdf.js
    // getData() call, or Chromium will reject it for losing the user gesture. In split view the
    // viewer is a same-origin iframe, so ask its top-level Schedule window to present the picker.
    var pickerWindow = window;
    try {
      if (EMBED && window.top && window.top.showSaveFilePicker) pickerWindow = window.top;
    } catch (e) {}
    if (pickerWindow.showSaveFilePicker) {
      var picked;
      try {
        picked = pickerWindow.showSaveFilePicker({
          suggestedName: name,
          types: [{ description: "PDF document", accept: { "application/pdf": [".pdf"] } }]
        });
      } catch (e) {
        window.alert("Could not open the Save As dialog: " + e.message);
        return;
      }
      picked.then(function (handle) {
        return doc.getData().then(function (bytes) {
          return handle.createWritable().then(function (writable) {
            return writable.write(new Blob([bytes], { type: "application/pdf" }))
              .then(function () { return writable.close(); });
          });
        });
      }).catch(function (e) {
        if (e && e.name === "AbortError") return; // user cancelled Save As
        window.alert("Could not save this PDF: " + ((e && e.message) || "unknown error"));
      });
      return;
    }

    // Firefox/Safari do not currently expose showSaveFilePicker; preserve the normal browser
    // download there instead of making the viewer's Download button stop working.
    doc.getData().then(function (bytes) {
      classicDownload(new Blob([bytes], { type: "application/pdf" }), name);
    }).catch(function (e) {
      window.alert("Could not prepare this PDF for download: " + e.message);
    });
  });

  // The lesson from the importer applies here too: a pdf.js document holds every parsed page
  // (and the worker holds a copy) until it is destroyed.
  window.addEventListener("pagehide", function () {
    if (egmNavigation) { egmNavigation.dispose(); egmNavigation = null; }
    cleanupPrintFrame();
    if (doc) { try { doc.destroy(); } catch (e) {} doc = null; }
  });
})();
</script>
</body>
</html>
